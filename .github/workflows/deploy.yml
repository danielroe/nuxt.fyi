name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run test:types
      - run: pnpm test
      - run: pnpm --filter nuxt-fyi-dashboard build

  deploy-scanner:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_SCANNER_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      - run: flyctl deploy --remote-only --config fly.scanner.toml

  deploy:
    needs: deploy-scanner
    runs-on: ubuntu-latest
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: nuxt-fyi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      # Snapshot the data volume before deploying
      - name: snapshot data volume
        continue-on-error: true
        run: |
          set -euo pipefail
          vol_id=$(flyctl volumes list -a "$FLY_APP" --json | jq -r '.[] | select(.name == "nuxt_fyi_data") | .id' | head -n1)
          if [ -z "$vol_id" ]; then
            echo "no nuxt_fyi_data volume found; skipping snapshot"
            exit 0
          fi
          echo "snapshotting $vol_id"
          flyctl volumes snapshots create "$vol_id" -a "$FLY_APP"

      - run: flyctl deploy --remote-only
